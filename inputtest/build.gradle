plugins {
    id 'com.android.application'
}

android {
    namespace 'kz.rokid.inputtest'
    compileSdk 35

    defaultConfig {
        applicationId 'kz.rokid.inputtest'
        minSdk 32
        targetSdk 32
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        // Shared debug key (keystore/debug.keystore) so APKs built anywhere
        // (here, GitHub Actions, a laptop) update each other without reinstalling.
        debug {
            storeFile rootProject.file('keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
        abortOnError false
    }
}
