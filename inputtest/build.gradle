plugins {
    id 'com.android.application'
}

android {
    namespace 'kz.rokid.inputtest'
    compileSdk 35

    defaultConfig {
        applicationId 'kz.rokid.inputtest'
        minSdk 32
        targetSdk 32
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    lint {
        disable 'ExpiredTargetSdkVersion'
        abortOnError false
    }
}
