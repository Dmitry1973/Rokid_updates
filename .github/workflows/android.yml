name: Android checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-build-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run tests, lint, and debug build
        run: |
          chmod +x gradlew
          ./gradlew test lint assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rokid-zoom-ru-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            inputtest/build/outputs/apk/debug/inputtest-debug.apk
            horizon/build/outputs/apk/debug/horizon-debug.apk
